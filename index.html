// ---- Ses sistemi (Web Audio API; harici ses dosyası gerektirmez)
const Sound = (() => {
  let audio = null;
  let enabled = true;
  try { enabled = localStorage.getItem('break-bricks-sound') !== 'off'; } catch (e) {}
  function unlock() {
    if (!enabled) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audio) audio = new AC();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) {}
  }
  let master = null;
  function tone(freq, duration, type='sine', volume=0.045, slide=0) {
    if (!enabled) return;
    unlock();
    if (!audio) return;
    try {
      if (!master) {
        master = audio.createDynamicsCompressor();
        master.threshold.value = -14; master.ratio.value = 6;
        master.connect(audio.destination);
      }
      const now = audio.currentTime;
      const v = Math.min(0.2, volume * 1.9);
      const layers = [[freq, type, v], [freq / 2, 'sine', v * 0.6]];
      for (const [f, t, vol] of layers) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = t;
        osc.frequency.setValueAtTime(Math.max(40, f), now);
        if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide / (f === freq ? 1 : 2)), now + duration);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(vol, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain); gain.connect(master);
        osc.start(now); osc.stop(now + duration + 0.02);
      }
    } catch (e) {}
  }
  function play(name) {
    if (!enabled) return;
    switch (name) {
      case 'launch': tone(330, .10, 'triangle', .04, 280); break;
      case 'paddle': tone(210, .075, 'sine', .035, 110); break;
      case 'wall': tone(145, .045, 'sine', .018, 35); break;
      case 'brick': tone(470, .055, 'square', .022, -120); break;
      case 'break': tone(620, .11, 'triangle', .045, 420); break;
      case 'power': tone(520, .10, 'sine', .045, 260); setTimeout(() => tone(780, .13, 'sine', .04, 160), 75); break;
      case 'life': tone(660, .12, 'triangle', .045, 220); setTimeout(() => tone(880, .16, 'triangle', .04, 160), 100); break;
      case 'lost': tone(240, .20, 'sawtooth', .035, -130); break;
      case 'clear': tone(523, .15, 'triangle', .045, 0); setTimeout(() => tone(659, .15, 'triangle', .045, 0), 130); setTimeout(() => tone(784, .24, 'triangle', .05, 180), 260); break;
      case 'gameover': tone(330, .22, 'triangle', .045, -90); setTimeout(() => tone(220, .32, 'triangle', .045, -80), 210); break;
    }
  }
  function toggle() {
    enabled = !enabled;
    try { localStorage.setItem('break-bricks-sound', enabled ? 'on' : 'off'); } catch (e) {}
    if (enabled) { unlock(); play('power'); }
    return enabled;
  }
  return { play, unlock, toggle, get enabled() { return enabled; } };
})();

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  buildLevel() {
    this.brickVer++;

    // Her bölüm, 12 farklı geometrik desen ailesinden birini kullanır.

      // 4. Kalp benzeri çift kanat ve sivri alt uç
      (r,c,y,x) => (y < 0.42 && Math.abs(x) > 0.12 && Math.abs(x) < 0.98 - y * 0.18) ||

      if (!nb.length) { st.pop(); continue; }

      seen[ny * W + nx] = 1; open(x, y, nx, ny); st.push([nx, ny]);

    // ekstra açıklıklar: çıkmaz sokaklar azalır, farklı yollar oluşur
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (x + 1 < W && this.hp[(3 * y + 1) * COLS + 3 * (x + 1)] === -1 && rnd() < 0.04) open(x, y, x + 1, y);
      if (y + 1 < H && this.hp[(3 * (y + 1)) * COLS + 3 * x + 1] === -1 && rnd() < 0.04) open(x, y, x, y + 1);
    }
    let count = 0;
    for (let r = 0; r < R; r++) for (let c = 0; c < COLS; c++) {
      if (this.hp[r * COLS + c] !== 0) continue;
      let hp = 1;
      if (rnd() < Math.min(0.75, 0.15 + 0.05 * this.level)) hp = 2;
      if (this.level >= 3 && rnd() < Math.min(0.35, 0.05 + 0.02 * this.level)) hp = 3;
      this.hp[r * COLS + c] = hp; count++;
    }
    const ent = Math.floor(rnd() * W); // tüm labirentin TEK girişi (2 tuğla genişliğinde)
    for (let k = 1; k <= 2; k++) this.hp[(3 * H) * COLS + 3 * ent + k] = 0;
    this.entrance = ent;

  // Elle tasarlanmış deseni hp dizisine yükler. Geçersizse false döner (çağıran mevcut üretime geçer).
  applyPattern(name) {

        w = Math.max(w, pat[r].length);

      const off = Math.floor((C.COLS - w) / 2);

        const rr = row + dr, cc = c + dc;
        if (rr < 0 || cc < 0) continue;

  // ---- güncelleme
  update(dt) {

    this.updateEffects(dt);

  updateEffects(dt) {

    if (this.shrinkT > 0) this.shrinkT = Math.max(0, this.shrinkT - dt);
    let target = C.PADDLE_BASE_W * (this.mode === 'crazy' ? 0.8 : 1);

  }
  stepBalls(dt) {
    const n = Math.max(1, Math.ceil(this.speed * dt / (C.BALL_R * 0.7)));
    const sdt = dt / n;
    let i = 0;
    while (i < this.ballCount) {
      let lost = false;
      for (let s = 0; s < n && !lost; s++) {
        this.bx[i] += this.bvx[i] * sdt;
        this.by[i] += this.bvy[i] * sdt;
        this.wallCollide(i);
        this.paddleCollide(i);
        this.brickCollide(i);

      }

  }
  wallCollide(i) {

    else if (this.bx[i] > C.WORLD_W - r) { this.bx[i] = C.WORLD_W - r; this.bvx[i] = -Math.abs(this.bvx[i]); }

          const pl = x - l, pr = rt - x, pt = y - t, pb = bt - y;
          const m = Math.min(pl, pr, pt, pb);

    this.by[i] = y + bny * bpen;
    const vn = this.bvx[i] * bnx + this.bvy[i] * bny;
    if (vn < 0) {

        const n0 = this.ballCount;

      }

        }

      case C.D_WIDE: this.wideT = 15; this.shrinkT = 0; break;
      case C.D_SHRINK: this.shrinkT = 12; this.wideT = 0; break;

    }
  }
  spawnRotated(src, a) {
    const c = Math.cos(a), s = Math.sin(a);
    const vx = this.bvx[src] * c - this.bvy[src] * s;
    const vy = this.bvx[src] * s + this.bvy[src] * c;
    this.addBall(this.bx[src], this.by[src], vx, vy);
  }
  addBall(x, y, vx, vy) {
    if (this.ballCount >= C.MAX_BALLS) return;
    const k = this.ballCount;
    this.bx[k] = x; this.by[k] = y; this.bvx[k] = vx; this.bvy[k] = vy;
    this.normalizeVel(k);

  }
  removeBall(i) {

    const n = this.ballCount;

  }
  removeDrop(i) {
    this.dropCount--;
    const n = this.dropCount;
    this.dropX[i] = this.dropX[n]; this.dropY[i] = this.dropY[n]; this.dropType[i] = this.dropType[n];
  }
  afterBalls() {

      this.buildLevel(); // top düşünce tuğlalar başlangıç düzenine döner
      if (this.lives <= 0) { this.lives = 0; this.dropCount = 0; this.state = 'GAME_OVER'; Sound.play('gameover'); }

  }

  // ---- parçacıklar
  spawnParticles(x, y, hue, n) {
    n = Math.round(n * (window.__COL ? window.__COL.fxK : 1));
    if (n <= 0) return;
    for (let q = 0; q < n; q++) {
      const k = this.ptHead;
      this.ptHead = (this.ptHead + 1) % C.MAX_PARTICLES;
      this.ptX[k] = x; this.ptY[k] = y;
      const a = Math.random() * 6.2831855;

      this.ptLife[k] -= dt;
      this.ptX[k] += this.ptVX[k] * dt; this.ptY[k] += this.ptVY[k] * dt;

  }

      text('OYUN BİTTİ', W / 2, midY - 40, 58, '#fff');
      text('SKOR ' + g.score, W / 2, midY + 20, 32, '#fff', 'center', 500);
      if (g.newRecord) text('YENİ REKOR!', W / 2, midY + 64, 32, COL.gold, 'center', 500);
      const btn = (y, label, color) => { ctx.fillStyle = color; rr(110, y, 500, 80, 16); text(label, W / 2, y + 51, 30, COL.ink, 'center'); };
      btn(midY + 100, 'BÖLÜM ' + g.level + ' İLE DEVAM', COL.btnA);
      btn(midY + 200, 'EN BAŞTAN BAŞLA', COL.btnB);
    }
  }

  // Girdi: göreli sürükleme (parmak raketi kapatmaz) + dokunma
  let dragging = false, lastX = 0, downX = 0, downY = 0, travel = 0;
  cv.addEventListener('pointerdown', (e) => {
    Sound.unlock();
    dragging = true; lastX = e.clientX; downX = e.clientX; downY = e.clientY; travel = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    travel += Math.abs(dx) + Math.abs(e.movementY || 0);
    lastX = e.clientX;
    game.onDrag(dx / cs * 1.1);
  });
  function endPointer(e, tap) {
    if (!dragging) return;
    dragging = false;
    if (tap && travel < 12) {
      const r = cv.getBoundingClientRect();
      game.onTap((downX - r.left) / cs, (downY - r.top) / cs);
    }
  }
  cv.addEventListener('pointerup', (e) => endPointer(e, true));
  cv.addEventListener('pointercancel', (e) => endPointer(e, false));
  cv.addEventListener('contextmenu', (e) => e.preventDefault());

  // Klavye (bilgisayarda deneyenler için)
  const keys = { left: false, right: false };
  window.addEventListener('keydown', (e) => {
    Sound.unlock();
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    else if (game.state === 'GAME_OVER' && (e.key === ' ' || e.key === 'Enter')) { game.continueLevel(); e.preventDefault(); }
    else if (game.state === 'GAME_OVER' && e.key === 'r') game.restart();
    else if (e.key === ' ' || e.key === 'Enter') { game.onTap(C.WORLD_W / 2, 600); e.preventDefault(); }
    else if (e.key === 'p') game.onTap(C.WORLD_W - 40, 40);
    else if (e.key === 'Escape') game.state = 'LEVEL_SELECT';
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) game.pauseIfPlaying(); });

  function saveBest() {
    try { localStorage.setItem(KEY, String(game.best)); } catch (e) {}
    game.bestDirty = false;
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) game.onDrag(dir * 900 * dt);
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 12) { game.update(STEP); acc -= STEP; steps++; }
    if (game.bestDirty && game.state === 'GAME_OVER') saveBest();
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.addEventListener('pagehide', () => { if (game.bestDirty) saveBest(); });
})();
</script>

  };
  const PADCSS = { rainbow: 'linear-gradient(90deg,#ff4d6d,#ffb347,#ffe66d,#6dffb0,#4dc3ff,#b46cff)', stripe: 'repeating-linear-gradient(115deg,#ffd45c 0 8px,#2a2f4a 8px 14px)', metal: 'linear-gradient(#eef2fa,#9aa6bd 45%,#59647c)', wood: 'repeating-linear-gradient(#b5733a 0 4px,#8a521f 4px 5px)', glass: 'linear-gradient(rgba(190,240,255,.8),rgba(120,200,255,.4))' };

  hx.innerHTML = '<input type=checkbox switch>'; st.appendChild(hx);
  const embedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const buzz = p => {
    if (!S.vib) return;

    const k = Math.max(0.25, Math.min(5, (S.vp || 100) / 100));

  };
  const sp = Sound.play;

  // Tamamlanan bölüm sayacı (görevler için): seviye bitince nextLevel çağrılır.
  const nl = Game.prototype.nextLevel;
  Game.prototype.nextLevel = function () { if (this === G && this.state === 'LEVEL_CLEAR') { S.cleared++; save(); } nl.call(this); };

  const stars = () => (G.levelStars || []).reduce((a, b) => a + (b || 0), 0);
  const stStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
  const claimable = () => EARN_DIA && TASKS.some((t, i) => S.cleared >= t[0] && !S.claimed.includes(i));
  let deco = '';

  function ask(title, text, btns) {
    layer(nt, '<div class=win><div class=wh><span class=dia></span><h2>' + title + '</h2><span class=dia></span></div><div class=wb><p style="text-align:center;font-size:18px;margin:8px 0">' + text + '</p><div class=nb>' +
      btns.map(b => '<button class=' + b[1] + ' data-a=' + b[2] + '>' + b[0] + '</button>').join('') + '</div></div></div>');
  }
  function toast(t) { const d = document.createElement('div'); d.className = 'tst'; d.textContent = t; el.appendChild(d); setTimeout(() => d.remove(), 950); }

  function storeHtml() {
    const tabs = [['d', 'ELMAS'], ['k', 'TOP'], ['r', 'RAKET']];
    let b = '<div class=tabs>' + tabs.map(t => '<button class="tab' + (tab === t[0] ? ' a' : '') + '" data-a=tab:' + t[0] + '>' + t[1] + '</button>').join('') + '</div><div class=gr>';
    if (tab === 'd') b += '<div class=card style="grid-column:1/3"><div style="font-size:40px">💎</div>Test sürümü: elmas sınırsız.<button class=buy data-a=tasks>GÖREVLER</button></div>';
    else {
      const t = tab === 'k' ? 'b' : 'p';
      b += SKINS[t].map(it => {
        const own = S.owned.includes(it[0]), on = S.eq[t] === it[0];
        const pv = it[0] === 'b10' ? (window.__customURL ? '<div style="width:44px;height:44px;border-radius:50%;margin:6px 0;background:url(' + window.__customURL + ') center/cover;border:2px solid #fff"></div>' : '<div style="font-size:40px;line-height:44px;margin:6px 0">🖼️</div>') : it[0] === 'b9' ? '<div style="font-size:44px;line-height:44px;margin:6px 0">⚽</div>' : it[0] === 'b8' ? '<div style="font-size:46px;line-height:44px;margin:6px 0;color:#ff4f8b;text-shadow:0 0 14px #ff4f8b">♥</div>' : '<div class=' + (t === 'b' ? 'pvb' : 'pvp') + ' style="background:' + (it[4] ? PADCSS[it[4]] : (BALLCSS[it[0]] || it[2])) + ';color:' + it[2] + '"></div>';
        const btn = on ? '<button class="buy k">KULLANILIYOR</button>' : own ? '<button class=buy data-a=eq:' + t + ':' + it[0] + '>KULLAN</button>' : '<button class=buy data-a=buy:' + t + ':' + it[0] + '>💎 ' + it[3] + '</button>';
        return '<div class=card>' + pv + it[1] + (it[0] === 'b10' ? (window.__customURL && !on ? '<button class=buy data-a=eq:b:b10>KULLAN</button>' : '<button class=buy data-a=pick>' + (window.__customURL ? 'DEĞİŞTİR' : 'RESİM SEÇ') + '</button>') : btn) + '</div>';
      }).join('');
    }
    return frame('Mağaza', b + '</div>');
  }
  function tasksHtml() {
    return frame('Görevler', '<div class=gr>' + TASKS.map((t, i) => {
      const done = S.cleared >= t[0], got = S.claimed.includes(i);
      const btn = got ? '<button class="buy g">ALINDI</button>' : done && !EARN_DIA ? '<button class="buy g">YAKINDA</button>' : done ? '<button class="buy k" data-a=claim:' + i + '>AL</button>' : '<button class="buy g">TAMAMLANMADI</button>';
      return '<div class=card>' + t[0] + ' bölüm oyna<div class=bar><i style="width:' + Math.min(100, S.cleared / t[0] * 100) + '%"></i></div>' + Math.min(S.cleared, t[0]) + ' / ' + t[0] + '<span>💎 ' + t[1] + '</span>' + btn + '</div>';
    }).join('') + '</div>');
  }
  const setHtml = () => frame('Ayarlar', '<div class=gr><div class=card style="grid-column:1/3;flex-direction:row;justify-content:space-between"><span>Ses</span><button class="buy' + (Sound.enabled ? '' : ' g') + '" data-a=snd>' + (Sound.enabled ? '🔊 AÇIK' : '🔇 KAPALI') + '</button></div><div class=card style="grid-column:1/3;flex-direction:row;justify-content:space-between"><span>Efektler</span><span style="display:flex;align-items:center;gap:8px"><button class=buy style="min-width:44px;padding:8px 0" data-a=fxp:-25>−</button><b style="min-width:72px">' + ((S.fxp == null ? 100 : S.fxp) <= 0 ? 'KAPALI' : '%' + (S.fxp == null ? 100 : S.fxp)) + '</b><button class=buy style="min-width:44px;padding:8px 0" data-a=fxp:25>+</button></span></div><div class=card style="grid-column:1/3;flex-direction:row;justify-content:space-between"><span>Titreşim</span><button class="buy' + (S.vib ? '' : ' g') + '" data-a=vib>' + (S.vib ? '📳 AÇIK' : '📴 KAPALI') + '</button></div>' + (S.vib ? '<div class=card style="grid-column:1/3;font-size:14px">Cihaz desteği: ' + (navigator.vibrate ? '<b style="color:#7dff8f">VAR</b>' : '<b style="color:#ff8a8a">YOK</b> (iPhone veya desteklemeyen tarayıcı)') + (embedded ? '<br>Sayfa gömülü pencerede açık: tarayıcı titreşimi engelleyebilir, dosyayı doğrudan Chrome\'da aç.' : '') + '<button class=buy data-a=vtest>TİTREŞİMİ DENE</button></div><div class=card style="grid-column:1/3;flex-direction:row;justify-content:space-between"><span>Şiddet</span><span style="display:flex;align-items:center;gap:8px"><button class=buy style="min-width:44px;padding:8px 0" data-a=vp:-25>−</button><b style="min-width:52px">%' + S.vp + '</b><button class=buy style="min-width:44px;padding:8px 0" data-a=vp:25>+</button></span></div>' : '') + '</div>');
  const refresh = () => { if (win) layer(mod, win === 'store' ? storeHtml() : win === 'tasks' ? tasksHtml() : setHtml()); if (screen === 'main') render(); };
  const open = w => { win = w; layer(mod, w === 'store' ? storeHtml() : w === 'tasks' ? tasksHtml() : setHtml()); };
  function start(n, crazy) { G.mode = crazy ? 'crazy' : 'normal'; const max = crazy ? 12 : 36, ul = crazy ? G.crazyUnlocked : G.unlockedLevel; if (n < 1 || n > max || n > ul) return; Sound.unlock(); G.startLevel(n); hide(); }

  function act(a) {
    const p = a.split(':');
    switch (p[0]) {
      case 'play': start(Math.min(36, G.unlockedLevel)); break;
      case 'levels': show('levels'); break;
      case 'clevels': show('clevels'); break;
      case 'cl': start(+p[1], true); break;
      case 'back': show('main'); break;
      case 'lv': start(+p[1]); break;
      case 'mode': ask('Bildirim', 'Bu oyun modu henüz hazır değil.', [['Tamam', 'or', 'nc']]); break;
      case 'tasks': open('tasks'); break;
      case 'store': tab = p[1]; open('store'); break;
      case 'tab': tab = p[1]; refresh(); break;
      case 'set': open('set'); break;
      case 'close': closeWin(); if (screen === 'main') render(); break;
      case 'vtest': buzz(300); break;
      case 'vp': S.vp = Math.max(25, Math.min(500, (S.vp || 100) + (+p[1]))); save(); buzz(60); refresh(); break;
      case 'vib': S.vib = !S.vib; save(); buzz(60); refresh(); break;
      case 'snd': Sound.toggle(); refresh(); break;
      case 'pick': fi.click(); break;
      case 'fxp': S.fxp = Math.max(0, Math.min(100, (S.fxp == null ? 100 : S.fxp) + (+p[1]))); save(); applySkin(); buzz(60); refresh(); break;
      case 'claim': { const i = +p[1], t = TASKS[i]; if (!EARN_DIA || !t || S.cleared < t[0] || S.claimed.includes(i)) break; S.dia += t[1]; S.claimed.push(i); save(); toast('+' + t[1] + ' 💎'); refresh(); break; }
      case 'buy': { const it = SKINS[p[1]] && SKINS[p[1]].find(x => x[0] === p[2]); if (!it || S.owned.includes(it[0])) break; pend = [p[1], it]; ask('Bildirim', it[1] + ' ürününü 💎 ' + it[3] + ' karşılığında satın almak istiyor musun?', [['İptal', 'or', 'nc'], ['Satın Al', 'pk', 'nb']]); break; }
      case 'nb': {
        layer(nt, '', false); if (!pend) break;
        const t = pend[0], it = pend[1]; pend = null;
        if (S.owned.includes(it[0])) break;
        if (!UNLIMITED_DIA && S.dia < it[3]) { setTimeout(() => ask('Bildirim', 'Yeterli elmasın yok.', [['Tamam', 'or', 'nc']]), 230); break; }
        if (!UNLIMITED_DIA) S.dia -= it[3]; S.owned.push(it[0]); S.eq[t] = it[0]; save(); applySkin(); refresh(); break;
      }
      case 'nc': layer(nt, '', false); pend = null; break;
      case 'eq': if (S.owned.includes(p[2]) && SKINS[p[1]]) { S.eq[p[1]] = p[2]; save(); applySkin(); refresh(); } break;
    }
  }
  const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*';
  fi.style.cssText = 'position:absolute;left:-9999px;opacity:0;pointer-events:none'; st.appendChild(fi);
  fi.addEventListener('change', () => {
    const f = fi.files && fi.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => window.__setCustomBall(rd.result, url => {
      try { localStorage.setItem('break-bricks-custom', url); } catch (e) {}
      S.eq.b = 'b10'; save(); applySkin(); refresh();
    });
    rd.readAsDataURL(f); fi.value = '';
  });
  const onClick = e => { const b = e.target.closest('[data-a]'); if (b) { Sound.unlock(); buzz(35); act(b.dataset.a); } };
  el.addEventListener('click', onClick);
  // Oyun alanına her dokunuş ve sürükleme titreşim verir.
  let lastDragBuzz = 0;
  st.addEventListener('pointerdown', () => buzz(25), true);
  st.addEventListener('pointermove', e => { if (e.buttons && e.timeStamp - lastDragBuzz > 90) { lastDragBuzz = e.timeStamp; buzz(12); } }, true);
  pb.addEventListener('click', () => { G.state = 'LEVEL_SELECT'; });
  // Oyun durumu menüye döndüğünde (Esc, son bölüm) menüyü aç; duraklatmada "Ana menü" düğmesini göster.
  setInterval(() => {
    if (G.state === 'LEVEL_SELECT' && el.style.display === 'none') show('main');
    pb.style.display = G.state === 'PAUSED' ? 'block' : 'none';
  }, 150);
  window.BBMenu = { S, TASKS, SKINS, act, show, hide };
  show('main');
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
